<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問卷調查 v3</title>
<style>
  body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f6f8; margin: 0; padding: 24px 16px 80px; color: #222; }
  .version-badge { max-width: 640px; margin: 0 auto 12px; text-align: right; font-size: 12px; color: #9ca3af; }
  .card { max-width: 640px; margin: 0 auto 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 32px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 24px; font-size: 14px; }
  fieldset { border: none; margin: 0 0 24px; padding: 0; }
  legend { font-weight: 600; margin-bottom: 8px; }
  label { display: block; margin: 6px 0; font-size: 14px; cursor: pointer; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  textarea { min-height: 80px; resize: vertical; }
  button { background: #2563eb; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }

  .code-box { background: #111827; color: #34d399; font-size: 26px; font-weight: 700; letter-spacing: 2px; text-align: center; padding: 20px; border-radius: 8px; margin: 20px 0; word-break: break-all; }
  .thanks-actions { display: flex; gap: 10px; }
  .thanks-actions button { flex: 1; }
  .btn-secondary { background: #6b7280; }
  .btn-secondary:hover { background: #4b5563; }

  .error-box { background: #fef2f2; color: #991b1b; padding: 16px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="version-badge">頁面版本: v3</div>

  <div class="card" id="surveyCard">
    <h1>簡易問卷調查</h1>
    <div class="sub">填寫完畢送出後，會取得一組專屬兌換序號。</div>
    <form id="surveyForm">
      <fieldset>
        <legend>1. 您的姓名</legend>
        <input type="text" name="name" placeholder="請輸入姓名">
      </fieldset>

      <fieldset>
        <legend>2. 您對本服務的整體滿意度？</legend>
        <label><input type="radio" name="satisfaction" value="非常滿意" required> 非常滿意</label>
        <label><input type="radio" name="satisfaction" value="滿意"> 滿意</label>
        <label><input type="radio" name="satisfaction" value="普通"> 普通</label>
        <label><input type="radio" name="satisfaction" value="不滿意"> 不滿意</label>
        <label><input type="radio" name="satisfaction" value="非常不滿意"> 非常不滿意</label>
      </fieldset>

      <fieldset>
        <legend>3. 您最常使用哪些功能？（可複選）</legend>
        <label><input type="checkbox" name="feature" value="公告"> 公告</label>
        <label><input type="checkbox" name="feature" value="活動"> 活動</label>
        <label><input type="checkbox" name="feature" value="客服"> 客服</label>
        <label><input type="checkbox" name="feature" value="商城"> 商城</label>
      </fieldset>

      <fieldset>
        <legend>4. 其他意見或建議</legend>
        <textarea name="comment" placeholder="請留下您的意見"></textarea>
      </fieldset>

      <button type="submit" id="submitBtn">送出問卷</button>
    </form>
  </div>

  <div class="card hidden" id="thanksCard">
    <h1>感謝您的填答！</h1>
    <div class="sub">請使用下方序號至遊戲內兌換獎勵：</div>
    <div class="code-box" id="codeBox">------</div>
    <div class="thanks-actions">
      <button id="copyCodeBtn">複製序號</button>
    </div>
  </div>

  <div class="card hidden" id="errorCard">
    <h1>送出失敗</h1>
    <div class="error-box" id="errorMsg"></div>
    <div class="thanks-actions" style="margin-top:16px;">
      <button class="btn-secondary" id="retryBtn">重新送出</button>
    </div>
  </div>

<script>
var PAGE_VERSION = "v3";
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynGowWk2Q8o8iaHRR3Kp5ZXOwDE2nbvuar40arEdGxyuOrN7Au9dYeHMqqw4yc852J/exec";

function getIp() {
  return fetch("https://api.ipify.org?format=json")
    .then(function (r) { return r.json(); })
    .then(function (d) { return d.ip; })
    .catch(function () {
      return fetch("https://ipapi.co/json/")
        .then(function (r) { return r.json(); })
        .then(function (d) { return d.ip; });
    })
    .catch(function () { return "unknown"; });
}

function showCard(id) {
  ["surveyCard", "thanksCard", "errorCard"].forEach(function (cid) {
    document.getElementById(cid).classList.toggle("hidden", cid !== id);
  });
}

function submitSurvey(e) {
  e.preventDefault();
  var form = document.getElementById("surveyForm");
  var submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "送出中...";

  var data = new FormData(form);

  getIp().then(function (ip) {
    var payload = {
      ip: ip,
      name: data.get("name") || "",
      satisfaction: data.get("satisfaction") || "",
      features: data.getAll("feature").join("、"),
      comment: data.get("comment") || ""
    };
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      submitBtn.disabled = false;
      submitBtn.textContent = "送出問卷";
      if (res.ok) {
        document.getElementById("codeBox").textContent = res.code;
        showCard("thanksCard");
      } else {
        document.getElementById("errorMsg").textContent = res.error || "未知錯誤，請稍後再試。";
        showCard("errorCard");
      }
    })
    .catch(function (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = "送出問卷";
      document.getElementById("errorMsg").textContent = "網路連線失敗，請確認網路狀態後再試一次。\n(" + (err.message || err) + ")";
      showCard("errorCard");
    });
}

document.getElementById("surveyForm").addEventListener("submit", submitSurvey);

document.getElementById("copyCodeBtn").addEventListener("click", function () {
  var code = document.getElementById("codeBox").textContent;
  var ta = document.createElement("textarea");
  ta.value = code;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); alert("已複製序號: " + code); }
  catch (e) { alert("複製失敗，請手動選取畫面上的序號。"); }
  document.body.removeChild(ta);
});

document.getElementById("retryBtn").addEventListener("click", function () {
  showCard("surveyCard");
});
</script>
</body>
</html>
