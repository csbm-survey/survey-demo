<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問卷調查 v2</title>
<style>
  body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f4f6f8; margin: 0; padding: 24px 16px 80px; color: #222; }
  .version-badge { max-width: 640px; margin: 0 auto 12px; text-align: right; font-size: 12px; color: #9ca3af; }
  .card { max-width: 640px; margin: 0 auto 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 32px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 24px; font-size: 14px; }
  fieldset { border: none; margin: 0 0 24px; padding: 0; }
  legend { font-weight: 600; margin-bottom: 8px; }
  label { display: block; margin: 6px 0; font-size: 14px; cursor: pointer; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  textarea { min-height: 80px; resize: vertical; }
  button { background: #2563eb; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #ecfdf5; color: #065f46; display: none; white-space: pre-wrap; font-size: 14px; }

  .ip-card { max-width: 640px; margin: 0 auto; background: #111827; color: #d1fae5; border-radius: 12px; padding: 20px; font-size: 13px; }
  .ip-card h3 { margin: 0 0 10px; color: #93c5fd; font-size: 14px; }
  .ip-value { background: #030712; padding: 16px; border-radius: 8px; font-size: 22px; font-weight: 700; text-align: center; letter-spacing: 1px; word-break: break-all; }
  .ip-value.loading { color: #9ca3af; font-size: 14px; font-weight: 400; }
  .ip-value.error { color: #f87171; font-size: 13px; font-weight: 400; }
  .ip-actions { display: flex; gap: 8px; margin-top: 10px; }
  .ip-actions button { background: #374151; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .ip-actions button:hover { background: #4b5563; }
</style>
</head>
<body>
  <div class="version-badge">頁面版本: v2</div>
  <div class="card">
    <h1>簡易問卷調查</h1>
    <div class="sub">測試用問卷頁面，填寫完畢請按送出。</div>
    <form id="surveyForm">
      <fieldset>
        <legend>1. 您的姓名</legend>
        <input type="text" name="name" placeholder="請輸入姓名">
      </fieldset>

      <fieldset>
        <legend>2. 您對本服務的整體滿意度？</legend>
        <label><input type="radio" name="satisfaction" value="非常滿意" required> 非常滿意</label>
        <label><input type="radio" name="satisfaction" value="滿意"> 滿意</label>
        <label><input type="radio" name="satisfaction" value="普通"> 普通</label>
        <label><input type="radio" name="satisfaction" value="不滿意"> 不滿意</label>
        <label><input type="radio" name="satisfaction" value="非常不滿意"> 非常不滿意</label>
      </fieldset>

      <fieldset>
        <legend>3. 您最常使用哪些功能？（可複選）</legend>
        <label><input type="checkbox" name="feature" value="公告"> 公告</label>
        <label><input type="checkbox" name="feature" value="活動"> 活動</label>
        <label><input type="checkbox" name="feature" value="客服"> 客服</label>
        <label><input type="checkbox" name="feature" value="商城"> 商城</label>
      </fieldset>

      <fieldset>
        <legend>4. 其他意見或建議</legend>
        <textarea name="comment" placeholder="請留下您的意見"></textarea>
      </fieldset>

      <button type="submit">送出問卷</button>
    </form>
    <div id="result"></div>
  </div>

  <div class="ip-card">
    <h3>你目前的 IP 位址</h3>
    <div class="ip-value loading" id="ipValue">查詢中...</div>
    <div class="ip-actions">
      <button id="ipRetry">重新查詢</button>
      <button id="ipCopy">複製 IP</button>
    </div>
  </div>

<script>
var PAGE_VERSION = "v2";

document.getElementById("surveyForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var data = new FormData(e.target);
  var lines = [];
  lines.push("姓名: " + (data.get("name") || "未填"));
  lines.push("滿意度: " + (data.get("satisfaction") || "未選"));
  lines.push("常用功能: " + (data.getAll("feature").join("、") || "無"));
  lines.push("意見: " + (data.get("comment") || "無"));
  var box = document.getElementById("result");
  box.style.display = "block";
  box.textContent = "感謝您的填答！\n\n" + lines.join("\n");
});

(function () {
  var ipEl = document.getElementById("ipValue");
  var currentIp = null;

  function setLoading() {
    ipEl.className = "ip-value loading";
    ipEl.textContent = "查詢中...";
  }

  function setError(msg) {
    ipEl.className = "ip-value error";
    ipEl.textContent = "查詢失敗: " + msg;
  }

  function setIp(ip) {
    currentIp = ip;
    ipEl.className = "ip-value";
    ipEl.textContent = ip;
  }

  function fetchIp() {
    setLoading();
    fetch("https://api.ipify.org?format=json")
      .then(function (r) { return r.json(); })
      .then(function (data) { setIp(data.ip); })
      .catch(function () {
        return fetch("https://ipapi.co/json/")
          .then(function (r) { return r.json(); })
          .then(function (data) { setIp(data.ip); });
      })
      .catch(function (err) { setError(err.message || String(err)); });
  }

  document.getElementById("ipRetry").addEventListener("click", fetchIp);
  document.getElementById("ipCopy").addEventListener("click", function () {
    if (!currentIp) { alert("目前沒有可複製的 IP"); return; }
    var ta = document.createElement("textarea");
    ta.value = currentIp;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); alert("已複製: " + currentIp); }
    catch (e) { alert("複製失敗，請手動選取: " + currentIp); }
    document.body.removeChild(ta);
  });

  fetchIp();
})();
</script>
</body>
</html>
